# Kartalardagi izohlar (ⓘ) — telefonda bosilganda, kompyuterda sichqoncha olib borilganda ko'rinadi.
# Yangi qator — \\n (izoh oynasida keyingi qatorga o'tadi).

# --- Bugun ---
tip.today.occupancy=Бугун тунда банд бўлган хоналар улуши: бугун ёки ундан олдин келиб, эртага ёки кейинроқ кетадиган меҳмонлар хоналари / жами хоналар.
tip.today.arrivals=Келиш санаси бугун бўлган бронлар сони (бекор қилинганларсиз). Ҳар бир хона алоҳида саналади.
tip.today.departures=Кетиш санаси бугун бўлган бронлар сони (бекор қилинганларсиз). Ҳар бир хона алоҳида саналади.
tip.today.debt=Меҳмон келган, лекин тўлиқ тўланмаган яшашларнинг қарзи — Exely PMS'даги қолдиқ (тўланиши керак сумма). Бекор қилинган ва келмаган бронлар кирмайди.\\nKartani босинг — батафсил ҳисобот очилади.

# --- Tanlangan davr ---
tip.occupancy=Танланган даврда сотилган хона-кечалар / мавжуд хона-кечалар (хоналар сони × кунлар).\\nMasalan, 82 / 490 — мавжуд 490 хона-кечадан 82 таси банд бўлган.
tip.adr=ADR (Average Daily Rate) — битта банд хона-кечанинг ўртача нархи:\\nяшаш даромади / сотилган хона-кечалар.\\nNonushta ва бошқа хизматлар кирмайди.
tip.revpar=RevPAR (Revenue Per Available Room) — ҳар бир мавжуд хона-кечага тўғри келадиган яшаш даромади:\\nяшаш даромади / мавжуд хона-кечалар.\\nBo'sh хоналар ҳам ҳисобга олинади — шунинг учун RevPAR = ADR × бандлик.
tip.revenue.rooms=Даврга тушган кечалар учун хона нархи: ҳар бир брон нархи унинг кечаларига тенг тақсимланади ва фақат шу даврдаги кечалар олинади.
tip.revenue.services=Даврга тушган кечалар учун яшаш нархи (эрта кириш ва кеч чиқиш билан) — Exely хизматлар ҳисоботидан, ҳар кун алоҳида. Нонушта ва бошқа хизматлар алоҳида кўрсатилади.
tip.payments=Шу даврда Exely'да қайд этилган тўловлар йиғиндиси (тўлов санаси бўйича). Қайтаришлар айирилган, бекор қилинган тўловлар ҳисобга олинмайди.\\nBu даромад эмас: тўлов олдиндан ёки кейинроқ қилиниши мумкин.
tip.payments.partial=Бу меҳмонхона Exely Connect орқали уланган — у фақат олдиндан тўловларни беради. Тўлиқ тўловлар учун админ саҳифасида Exely PMS калитини уланг.
tip.newBookings=Шу даврда тизимга тушган янги бронлар сони (ҳар бир хона алоҳида саналади).\\nExely брон яратилган вақтни бермайди — брон биринчи марта кўрилган вақт олинади.
tip.cancellations=Чапда — шу даврда бекор қилинган бронлар, ўнгда — келиш санаси шу даврда бўлиб, меҳмон келмаган (no-show) бронлар.\\nFoiz — бекор қилинганларнинг янги бронларга нисбати.\\nExely PMS келмаганларни алоҳида бермайди — PMS уланган меҳмонхонада ўнг сон 0 бўлади.
tip.los=Ўртача яшаш муддати: келиш санаси шу даврда бўлган бронларнинг ўртача кечалари сони.

# --- Qarzdorlik sahifasi ---
tip.debt.total=Меҳмон келган ва тўлиқ тўланмаган барча яшашлар қарзи (Exely PMS'даги қолдиқ). Бекор қилинган ва келмаган бронлар кирмайди.\\nKartani босинг — барча тоифалар.
tip.debt.inHouse=Меҳмон ҳозир меҳмонхонада (кетиш санаси ҳали келмаган). Одатда кетишда тўлайди.\\nKartani босинг — фақат шу тоифа.
tip.debt.checkedOut=Меҳмон кетган (PMS'да выселение қилинган), лекин қарзи қолган — ундириш керак.\\nKartani босинг — фақат шу тоифа.
tip.debt.notCheckedOut=Кетиш санаси ўтган, лекин PMS'да ҳамон "яшаяпти". Кўпинча ресепшн выселение қилишни унутган — PMS'да текшириб, тартибга келтириш керак.\\nKartani босинг — фақат шу тоифа.
tip.debt.aging=Қарз неча кундан бери турибди: кетиш санасидан бугунгача. Ҳозир яшаётганлар 0–30 кун гуруҳида.

# --- Bosh sahifa ---
tip.home.occupancy=Жорий ой бошидан бугунгача: сотилган хона-кечалар / мавжуд хона-кечалар.
tip.home.revenue=Жорий ой бошидан бугунгача жами даромад: яшаш + нонушта + бошқа хизматлар (Exely'даги "Выручка").
tip.flow.revenue=Шу даврда кўрсатилган хизматлар қиймати: яшаш + нонушта + бошқа хизматлар (хизмат санаси бўйича). Пул ҳали тушмаган бўлиши мумкин.
tip.flow.payments=Шу даврда кассага/ҳисобга тушган пул (тўлов санаси бўйича), қайтаришлар айирилган. Олдинги ёки кейинги яшашлар учун тўловлар ҳам киради.
tip.flow.gap=Даромад − тушум.\nМусбат (+) — хизмат кўрсатилган, лекин пули шу даврда тушмаган (қарзга ёки кейинги тўловга қолган).\nМанфий (−) — тушум даромаддан кўп: олдиндан тўловлар ёки эски қарзлар ёпилган.
tip.home.portfolio=Сизга очиқ меҳмонхоналар бўйича жорий ой бошидан бугунгача жами. Ўртача ADR оғирликли: жами яшаш даромади / жами сотилган хона-кечалар (катта меҳмонхона кўпроқ таъсир қилади).
