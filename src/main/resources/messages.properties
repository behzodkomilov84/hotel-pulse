# Kartalardagi izohlar (ⓘ) — telefonda bosilganda, kompyuterda sichqoncha olib borilganda ko'rinadi.
# Yangi qator — \\n (izoh oynasida keyingi qatorga o'tadi).

# --- Bugun ---
tip.today.occupancy=Bugun tunda band bo'lgan xonalar ulushi: bugun yoki undan oldin kelib, ertaga yoki keyinroq ketadigan mehmonlar xonalari / jami xonalar.
tip.today.arrivals=Kelish sanasi bugun bo'lgan bronlar soni (bekor qilinganlarsiz). Har bir xona alohida sanaladi.
tip.today.departures=Ketish sanasi bugun bo'lgan bronlar soni (bekor qilinganlarsiz). Har bir xona alohida sanaladi.
tip.today.debt=Mehmon kelgan, lekin to'liq to'lanmagan yashashlarning qarzi — Exely PMS'dagi qoldiq (to'lanishi kerak summa). Bekor qilingan va kelmagan bronlar kirmaydi.\\nKartani bosing — batafsil hisobot ochiladi.

# --- Tanlangan davr ---
tip.occupancy=Tanlangan davrda sotilgan xona-kechalar / mavjud xona-kechalar (xonalar soni × kunlar).\\nMasalan, 82 / 490 — mavjud 490 xona-kechadan 82 tasi band bo'lgan.
tip.adr=ADR (Average Daily Rate) — bitta band xona-kechaning o'rtacha narxi:\\nyashash daromadi / sotilgan xona-kechalar.\\nNonushta va boshqa xizmatlar kirmaydi.
tip.revpar=RevPAR (Revenue Per Available Room) — har bir mavjud xona-kechaga to'g'ri keladigan yashash daromadi:\\nyashash daromadi / mavjud xona-kechalar.\\nBo'sh xonalar ham hisobga olinadi — shuning uchun RevPAR = ADR × bandlik.
tip.revenue.rooms=Davrga tushgan kechalar uchun xona narxi: har bir bron narxi uning kechalariga teng taqsimlanadi va faqat shu davrdagi kechalar olinadi.
tip.revenue.services=Davrga tushgan kechalar uchun yashash narxi (erta kirish va kech chiqish bilan) — Exely xizmatlar hisobotidan, har kun alohida. Nonushta va boshqa xizmatlar alohida ko'rsatiladi.
tip.payments=Shu davrda Exely'da qayd etilgan to'lovlar yig'indisi (to'lov sanasi bo'yicha). Qaytarishlar ayirilgan, bekor qilingan to'lovlar hisobga olinmaydi.\\nBu daromad emas: to'lov oldindan yoki keyinroq qilinishi mumkin.
tip.payments.partial=Bu mehmonxona Exely Connect orqali ulangan — u faqat oldindan to'lovlarni beradi. To'liq to'lovlar uchun admin sahifasida Exely PMS kalitini ulang.
tip.newBookings=Shu davrda tizimga tushgan yangi bronlar soni (har bir xona alohida sanaladi).\\nExely bron yaratilgan vaqtni bermaydi — bron birinchi marta ko'rilgan vaqt olinadi.
tip.cancellations=Chapda — shu davrda bekor qilingan bronlar, o'ngda — kelish sanasi shu davrda bo'lib, mehmon kelmagan (no-show) bronlar.\\nFoiz — bekor qilinganlarning yangi bronlarga nisbati.\\nExely PMS kelmaganlarni alohida bermaydi — PMS ulangan mehmonxonada o'ng son 0 bo'ladi.
tip.los=O'rtacha yashash muddati: kelish sanasi shu davrda bo'lgan bronlarning o'rtacha kechalari soni.

# --- Qarzdorlik sahifasi ---
tip.debt.total=Mehmon kelgan va to'liq to'lanmagan barcha yashashlar qarzi (Exely PMS'dagi qoldiq). Bekor qilingan va kelmagan bronlar kirmaydi.\\nKartani bosing — barcha toifalar.
tip.debt.inHouse=Mehmon hozir mehmonxonada (ketish sanasi hali kelmagan). Odatda ketishda to'laydi.\\nKartani bosing — faqat shu toifa.
tip.debt.checkedOut=Mehmon ketgan (PMS'da vyselenie qilingan), lekin qarzi qolgan — undirish kerak.\\nKartani bosing — faqat shu toifa.
tip.debt.notCheckedOut=Ketish sanasi o'tgan, lekin PMS'da hamon "yashayapti". Ko'pincha resepshn vyselenie qilishni unutgan — PMS'da tekshirib, tartibga keltirish kerak.\\nKartani bosing — faqat shu toifa.
tip.debt.aging=Qarz necha kundan beri turibdi: ketish sanasidan bugungacha. Hozir yashayotganlar 0–30 kun guruhida.

# --- Bosh sahifa ---
tip.home.occupancy=Joriy oy boshidan bugungacha: sotilgan xona-kechalar / mavjud xona-kechalar.
tip.home.revenue=Joriy oy boshidan bugungacha jami daromad: yashash + nonushta + boshqa xizmatlar (Exely'dagi "Выручка").
tip.flow.revenue=Shu davrda ko'rsatilgan xizmatlar qiymati: yashash + nonushta + boshqa xizmatlar (xizmat sanasi bo'yicha). Pul hali tushmagan bo'lishi mumkin.
tip.flow.payments=Shu davrda kassaga/hisobga tushgan pul (to'lov sanasi bo'yicha), qaytarishlar ayirilgan. Oldingi yoki keyingi yashashlar uchun to'lovlar ham kiradi.
tip.flow.gap=Daromad − tushum.\nMusbat (+) — xizmat ko'rsatilgan, lekin puli shu davrda tushmagan (qarzga yoki keyingi to'lovga qolgan).\nManfiy (−) — tushum daromaddan ko'p: oldindan to'lovlar yoki eski qarzlar yopilgan.
tip.home.portfolio=Sizga ochiq mehmonxonalar bo'yicha joriy oy boshidan bugungacha jami. O'rtacha ADR og'irlikli: jami yashash daromadi / jami sotilgan xona-kechalar (katta mehmonxona ko'proq ta'sir qiladi).
