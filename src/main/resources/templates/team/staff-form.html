<!DOCTYPE html>
<html lang="uz" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${member == null} ? 'Yangi xodim' : ${member.username})}"></head>
<body>
<header th:replace="~{fragments/layout :: header('team-staff')}"></header>
<main class="container container-narrow" th:with="f=${form}">
    <div class="page-head reveal">
        <h1 th:text="${member == null} ? 'Yangi xodim' : (${member.fullName} ?: ${member.username})">Xodim</h1>
        <a class="btn btn-secondary" th:href="@{/team/staff}">← Xodimlar</a>
    </div>
    <th:block th:replace="~{fragments/layout :: alerts}"></th:block>

    <form class="card form reveal" method="post"
          th:action="${member == null} ? @{/team/staff} : @{/team/staff/{id}(id=${member.id})}">
        <div class="form-grid">
            <div class="field">
                <label for="fullName">F.I.Sh.</label>
                <input type="text" id="fullName" name="fullName" maxlength="150" autocomplete="off"
                       th:value="${f != null} ? ${f.fullName} : ${member?.fullName}" placeholder="Ism Familiya">
            </div>
            <div class="field">
                <label for="phone">Telefon</label>
                <input type="text" id="phone" name="phone" maxlength="32" placeholder="+998 90 123 45 67"
                       th:value="${f != null} ? ${f.phone} : ${member?.phone}">
            </div>
            <div class="field">
                <label for="username">Login *</label>
                <input type="text" id="username" name="username" required maxlength="64" pattern="[A-Za-z0-9_.\-]{3,64}"
                       autocomplete="off" th:value="${f != null} ? ${f.username} : ${member?.username}">
                <span class="hint">Lotin harflari, raqamlar, _ . - (3–64 belgi)</span>
            </div>
            <div class="field" th:if="${member == null}">
                <label for="password">Parol *</label>
                <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password">
                <span class="hint">Kamida 8 belgi — xodimga ayting, u Profil'da o'zgartira oladi.</span>
            </div>
            <div class="field" th:if="${member != null}">
                <label for="newPassword">Yangi parol</label>
                <input type="password" id="newPassword" name="newPassword" minlength="8" autocomplete="new-password"
                       placeholder="O'zgartirmaslik uchun bo'sh qoldiring">
            </div>
        </div>

        <div class="field">
            <label>Bo'limlar * <span class="muted">(bir nechtasini tanlash mumkin)</span></label>
            <fieldset class="dept-pick" th:each="g : ${groups}" th:if="${!g.departments.isEmpty()}">
                <legend th:text="${g.hotel.name}"></legend>
                <div class="check-list">
                    <label th:each="d : ${g.departments}">
                        <input type="checkbox" name="departmentIds" th:value="${d.id}" th:checked="${selected.contains(d.id)}">
                        <span th:text="${d.name}"></span>
                    </label>
                </div>
            </fieldset>
            <span class="hint">Xodim tanlangan bo'limlar mehmonxonasiga biriktiriladi.
                Kerakli bo'lim yo'q bo'lsa — <a th:href="@{/team/departments}">Bo'limlar</a> sahifasida qo'shing.</span>
        </div>

        <label class="check" th:if="${member != null}">
            <input type="checkbox" name="enabled" value="true" th:checked="${member.enabled}"> Faol (saytga va botga kira oladi)
        </label>

        <div class="form-actions">
            <a class="btn btn-secondary" th:href="@{/team/staff}">Bekor qilish</a>
            <button type="submit" class="btn btn-primary">Saqlash</button>
        </div>
    </form>
</main>
</body>
</html>
