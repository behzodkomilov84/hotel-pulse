<!DOCTYPE html>
<html lang="uz" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Бўлимлар')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('team-departments')}"></header>
<main class="container container-narrow">
    <div class="page-head reveal">
        <div>
            <h1>Бўлимлар</h1>
            <p class="muted dept-intro">Аввал бўлимларни яратинг, кейин <a th:href="@{/team/staff}">Ходимлар</a> саҳифасида ходимни бўлимга бириктиринг.
                Топшириқ беришда бўлим танланади ва шу бўлим ходимлари кўринади.</p>
        </div>
        <a class="btn btn-primary" th:href="@{/team/staff/new}">+ Ходим қўшиш</a>
    </div>
    <th:block th:replace="~{fragments/layout :: alerts}"></th:block>

    <div class="card empty reveal" th:if="${groups.isEmpty()}">
        <p><strong>Сизга ҳали меҳмонхона бириктирилмаган</strong></p>
    </div>

    <section class="card reveal dept-card" th:each="g : ${groups}">
        <h3 class="card-title" th:text="${g.hotel.name}">Меҳмонхона</h3>

        <ul class="dept-list" th:if="${!g.departments.isEmpty()}">
            <li th:each="d : ${g.departments}" class="dept-row">
                <form method="post" class="dept-rename" th:action="@{/team/departments/{id}/rename(id=${d.id})}">
                    <input type="text" name="name" required maxlength="64" th:value="${d.name}"
                           th:attr="aria-label='Бўлим номи: ' + ${d.name}">
                    <button type="submit" class="btn btn-secondary btn-sm">Сақлаш</button>
                </form>
                <span class="dept-count muted"
                      th:text="${g.members[d.id] != null} ? ${g.members[d.id]} + ' та ходим' : 'ходим йўқ'"></span>
                <form method="post" th:action="@{/team/departments/{id}/delete(id=${d.id})}"
                      onsubmit="return confirm('Бўлим ўчирилсинми? Ходимлар бўлимдан чиқади, ўзлари қолади.')">
                    <button type="submit" class="btn btn-danger btn-sm" aria-label="Ўчириш">Ўчириш</button>
                </form>
            </li>
        </ul>
        <p class="muted" th:if="${g.departments.isEmpty()}">Бўлим йўқ — пастда қўшинг.</p>

        <form method="post" class="dept-add" th:action="@{/team/departments}">
            <input type="hidden" name="hotelId" th:value="${g.hotel.id}">
            <input type="text" name="name" required maxlength="64" placeholder="Янги бўлим номи (масалан: Housekeeping)"
                   aria-label="Янги бўлим номи">
            <button type="submit" class="btn btn-primary btn-sm">+ Бўлим қўшиш</button>
        </form>
    </section>
</main>
</body>
</html>
