<!DOCTYPE html>
<html lang="uz" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title th:text="${title} + ' — HotelPulse'">HotelPulse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script th:src="@{/js/app.js}" defer></script>
</head>
<body>

<header th:fragment="header(active)" class="topbar">
    <a class="brand" th:href="@{/}"><span class="brand-dot"></span>HotelPulse</a>
    <nav class="nav" aria-label="Asosiy menyu">
        <a th:href="@{/}" th:classappend="${active == 'dashboard'} ? 'active'">Mehmonxonalar</a>

        <!-- Ochiladigan menyular: kompyuterda — olib borilganda, telefonda — bosilganda (app.js). -->
        <div class="nav-group" th:classappend="${active.startsWith('svc-')} ? 'active'">
            <button type="button" class="nav-toggle" aria-haspopup="true" aria-expanded="false">
                Xizmatlar <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div class="nav-menu">
                <a th:href="@{/services/invoices}" th:classappend="${active == 'svc-invoices'} ? 'active'">Hisob-fakturalar</a>
                <a th:href="@{/services/tasks}" th:classappend="${active == 'svc-tasks'} ? 'active'">Topshiriqlar</a>
            </div>
        </div>

        <div class="nav-group" sec:authorize="hasRole('OWNER')" th:classappend="${active.startsWith('admin-')} ? 'active'">
            <button type="button" class="nav-toggle" aria-haspopup="true" aria-expanded="false">
                Boshqaruv <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div class="nav-menu">
                <a th:href="@{/admin/hotels}" th:classappend="${active == 'admin-hotels'} ? 'active'">Mehmonxonalar</a>
                <a th:href="@{/admin/users}" th:classappend="${active == 'admin-users'} ? 'active'">Foydalanuvchilar</a>
            </div>
        </div>
    </nav>
    <div class="user-box">
        <a class="user-link" th:href="@{/profile}" th:classappend="${active == 'profile'} ? 'active'" title="Profil">
            <span class="avatar" th:text="${#strings.toUpperCase(#strings.substring(currentUser.displayName, 0, 1))}">A</span>
            <span class="name" th:text="${currentUser.displayName}">Foydalanuvchi</span>
        </a>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-secondary">Chiqish</button>
        </form>
    </div>
</header>

<!-- Izoh (ⓘ): kompyuterda sichqoncha olib borilganda, telefonda bosilganda ochiladi (app.js). Qatorlar — "\n". -->
<!-- span[role=button] — havola-kartalar (<a>) ichida ham to'g'ri HTML bo'lishi uchun. -->
<span class="tip" role="button" tabindex="0" th:fragment="tip(text)"
      th:attr="data-tip=${text}, aria-label='Izoh: ' + ${text}" aria-expanded="false">i</span>

<th:block th:fragment="alerts">
    <div class="alert alert-success" role="status" th:if="${success}" th:text="${success}"></div>
    <div class="alert alert-error" role="alert" th:if="${error}" th:text="${error}"></div>
</th:block>

</body>
</html>
