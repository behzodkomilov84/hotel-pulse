<!DOCTYPE html>
<html lang="uz" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title th:text="${title} + ' — HotelPulse'">HotelPulse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script th:src="@{/js/app.js}" defer></script>
</head>
<body>

<header th:fragment="header(active)" class="topbar">
    <a class="brand" th:href="@{/}"><span class="brand-dot"></span>HotelPulse</a>
    <nav class="nav">
        <a th:href="@{/}" th:classappend="${active == 'dashboard'} ? 'active'">Mehmonxonalar</a>
        <th:block sec:authorize="hasRole('OWNER')">
            <a th:href="@{/admin/hotels}" th:classappend="${active == 'admin-hotels'} ? 'active'">Boshqaruv: mehmonxonalar</a>
            <a th:href="@{/admin/users}" th:classappend="${active == 'admin-users'} ? 'active'">Boshqaruv: foydalanuvchilar</a>
        </th:block>
    </nav>
    <div class="user-box">
        <a class="user-link" th:href="@{/profile}" th:classappend="${active == 'profile'} ? 'active'" title="Profil">
            <span class="avatar" th:text="${#strings.toUpperCase(#strings.substring(currentUser.displayName, 0, 1))}">A</span>
            <span class="name" th:text="${currentUser.displayName}">Foydalanuvchi</span>
        </a>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-secondary">Chiqish</button>
        </form>
    </div>
</header>

<!-- Izoh (ⓘ): kompyuterda sichqoncha olib borilganda, telefonda bosilganda ochiladi (app.js). Qatorlar — "\n". -->
<button type="button" class="tip" th:fragment="tip(text)"
        th:attr="data-tip=${text}, aria-label='Izoh: ' + ${text}" aria-expanded="false">i</button>

<th:block th:fragment="alerts">
    <div class="alert alert-success" role="status" th:if="${success}" th:text="${success}"></div>
    <div class="alert alert-error" role="alert" th:if="${error}" th:text="${error}"></div>
</th:block>

</body>
</html>
