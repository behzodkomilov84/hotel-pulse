<!DOCTYPE html>
<html lang="uz" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Фойдаланувчилар')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('admin-users')}"></header>
<main class="container">
    <div class="page-head reveal">
        <div>
            <h1>Фойдаланувчилар</h1>
            <p class="subtitle" th:text="'Жами: ' + ${users.size()}"></p>
        </div>
        <a class="btn btn-primary" th:href="@{/admin/users/new}">+ Фойдаланувчи қўшиш</a>
    </div>
    <th:block th:replace="~{fragments/layout :: alerts}"></th:block>

    <div class="card table-wrap reveal">
        <table>
            <thead>
            <tr><th>#</th><th>Логин</th><th>Ф.И.Ш.</th><th>Роли</th><th>Меҳмонхоналар</th><th>Ҳолати</th><th></th></tr>
            </thead>
            <tbody>
            <tr th:each="u : ${users}">
                <td th:text="${u.id}"></td>
                <td><strong th:text="${u.username}"></strong></td>
                <td th:text="${u.fullName} ?: '—'"></td>
                <td><span class="badge badge-role" th:text="${u.role.label}"></span></td>
                <td class="wrap">
                    <span th:if="${u.role.name() == 'OWNER'}">Барчаси</span>
                    <span th:if="${u.role.name() != 'OWNER' and u.hotels.isEmpty()}" class="badge badge-warn">Бириктирилмаган</span>
                    <span th:each="h, st : ${u.hotels}" th:text="${h.name} + (${st.last} ? '' : ', ')"></span>
                </td>
                <td>
                    <span class="badge badge-ok" th:if="${u.enabled}">Фаол</span>
                    <span class="badge badge-off" th:unless="${u.enabled}">Блокланган</span>
                </td>
                <td><a class="btn btn-secondary" th:href="@{/admin/users/{id}(id=${u.id})}">Таҳрирлаш</a></td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
