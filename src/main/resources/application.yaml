server:
  # StudyGrow lokal 8080'da ishlaydi — ikkalasi bir vaqtda ishga tushishi uchun.
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: HotelPulse
  # Lokal maxfiy qiymatlar (DB_PASSWORD, OWNER_PASSWORD, ...) loyiha
  # ildizidagi .env faylidan o'qiladi — u .gitignore'da, git'ga tushmaydi.
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/hotel_pulse?createDatabaseIfNotExist=true&rewriteBatchedStatements=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 50
  liquibase:
    change-log: classpath:db/changelog/master.xml

app:
  # Ilk ishga tushishda OWNER yo'q bo'lsa, shu login bilan yaratiladi
  # (OwnerBootstrap). Parol berilmasa — tasodifiy parol generatsiya qilinib,
  # logga BIR MARTA chiqariladi.
  owner:
    username: ${OWNER_USERNAME:owner}
    password: ${OWNER_PASSWORD:}
  # Exely API kalitlarini bazada shifrlash uchun (AES-256-GCM). Base64
  # ko'rinishidagi 32 baytlik kalit. Production'da ALBATTA berilishi shart —
  # bo'sh bo'lsa, faqat lokal ishlab chiqish uchun mo'ljallangan vaqtinchalik
  # kalit ishlatiladi (EncryptionConfig).
  encryption-key: ${APP_ENCRYPTION_KEY:}
  # Mehmonxona vaqt zonasi — "bugun" va Exely UTC vaqtlarini o'girish uchun.
  zone: ${APP_ZONE:Asia/Tashkent}
  telegram:
    # @BotFather'dan olingan token. Bo'sh bo'lsa — bot o'chirilgan.
    # Diqqat: bitta token bilan faqat bitta server ishlay oladi (lokal va production uchun alohida bot).
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    # Botdagi "Saytda batafsil" tugmasi uchun ommaviy manzil (localhost bo'lsa tugma chiqmaydi).
    site-url: ${APP_SITE_URL:http://localhost:8081}
    daily-report-cron: ${TELEGRAM_DAILY_REPORT_CRON:0 0 9 * * *}
  exely:
    base-url: ${EXELY_BASE_URL:https://connect.hopenapi.com}
    # Exely PMS Universal API (mehmonxona extranet'idagi "Ключ интеграции" bilan).
    pms-base-url: ${EXELY_PMS_BASE_URL:https://partner.tlintegration.com/api/webpms/v1}
    # Birinchi sinxronlashda shuncha kun oldingacha o'zgargan bronlar olinadi.
    initial-days: ${EXELY_INITIAL_DAYS:400}
    page-size: 1000
    # Bron tafsilotlari so'rovlari orasidagi pauza (API limitlari uchun).
    request-delay: ${EXELY_REQUEST_DELAY:120ms}
    scheduler-enabled: ${EXELY_SCHEDULER_ENABLED:true}
    sync-interval: ${EXELY_SYNC_INTERVAL:PT30M}
    initial-delay: PT1M
